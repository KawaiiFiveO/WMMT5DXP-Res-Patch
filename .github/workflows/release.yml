name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pefile

      - name: Build exe
        run: pyinstaller --onefile --name patch patch.py

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item README.txt dist/
          Compress-Archive -Path dist/patch.exe, dist/README.txt -DestinationPath W5P-ResPatch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: W5P-ResPatch
          path: W5P-ResPatch.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: W5P-ResPatch.zip
          generate_release_notes: true
